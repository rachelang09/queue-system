<title>Massage Chair Queue</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  /* Layout: a three-slot ticket board (past · now · next) on top, then "take a number" beside the live waiting list. */
  :root {
    --bg: #eef2f1; --surface: #ffffff; --ink: #17211f; --muted: #5c6b68; --line: #d5dfdc;
    --accent: #1f6f62; --accent-soft: #dcebe7; --on-accent: #ffffff;
    --ok: #1f8a4c; --warn: #b42318; --dim: #9aa8a5;
    --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f1615; --surface: #172120; --ink: #e6eeec; --muted: #93a5a1; --line: #26322f;
    --accent: #5cc2ad; --accent-soft: #1c3330; --on-accent: #0b1513;
    --ok: #43b77a; --warn: #f2766a; --dim: #5d6e6a; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0f1615; --surface: #172120; --ink: #e6eeec; --muted: #93a5a1; --line: #26322f;
    --accent: #5cc2ad; --accent-soft: #1c3330; --on-accent: #0b1513;
    --ok: #43b77a; --warn: #f2766a; --dim: #5d6e6a; color-scheme: dark; }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; }
  .wrap {
    max-width: 1000px; margin: 0 auto; display: grid; gap: 18px;
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h1 { font-family: var(--display); font-size: 1.45rem; margin: 0; text-wrap: balance; }
  .clock { color: var(--muted); font-variant-numeric: tabular-nums; }
  .status { color: var(--muted); font-size: .88rem; }
  .status.err { color: var(--warn); }

  .eyebrow { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .num { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }

  .called {
    background: var(--accent); color: var(--on-accent); border-radius: 14px; padding: 16px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .called .num { font-size: 2.4rem; }
  .called p { margin: 0; font-size: 1.05rem; flex: 1; min-width: 12em; }
  .called.mine { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { filter: brightness(1.15); } }
  @media (prefers-reduced-motion: reduce) { .called.mine { animation: none; } .bar > div { transition: none; } }

  .board { display: grid; grid-template-columns: 1fr 1.7fr 1fr; gap: 14px; }
  .slot { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; text-align: center; display: grid; gap: 8px; align-content: start; }
  .slot .num { font-size: 2.8rem; color: var(--dim); }
  .slot .sub { color: var(--muted); font-size: .88rem; min-height: 1.3em; }
  .slot.now { border: 2px solid var(--accent); }
  .slot.now .num { font-size: 4.4rem; color: var(--accent); }
  .timer { font-family: var(--display); font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .timer.small { font-size: 1rem; font-weight: 500; color: var(--muted); font-family: var(--body); }
  .bar { height: 6px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .9s linear; }
  .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
  .panel h2 { font-family: var(--display); font-size: 1.05rem; margin: 0; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  .durs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  button {
    font: inherit; font-weight: 500; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.sel, button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.primary { width: 100%; padding: 12px; font-weight: 600; }
  button.go { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.danger { color: var(--warn); }
  button.danger.armed { background: var(--warn); border-color: var(--warn); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }

  .mine-card { border: 2px dashed var(--accent); background: var(--accent-soft); border-radius: 12px; padding: 14px; text-align: center; display: grid; gap: 4px; }
  .mine-card .num { font-size: 2.4rem; color: var(--accent); }
  .mine-card .msg { color: var(--ink); }

  ul.q { list-style: none; margin: 0; padding: 0; }
  ul.q li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  ul.q li:last-child { border-bottom: 0; }
  ul.q .n { font-family: var(--display); font-weight: 700; width: 3.4em; font-variant-numeric: tabular-nums; }
  ul.q .who { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  ul.q .who small { color: var(--muted); }
  ul.q .eta { color: var(--muted); font-size: .82rem; text-align: right; font-variant-numeric: tabular-nums; }
  ul.q .you { font-size: .7rem; font-weight: 600; background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
  ul.q .x { padding: 3px 9px; font-size: .8rem; }
  .empty { color: var(--muted); font-style: italic; }

  footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: .85rem; }
  footer .btns { display: flex; gap: 8px; flex-wrap: wrap; }

  @media (max-width: 720px) {
    .board { grid-template-columns: 1fr 1fr; }
    .slot.now { grid-column: 1 / -1; order: -1; }
    .cols { grid-template-columns: 1fr; }
  }
</style>

<div class="wrap">
  <header>
    <h1>Massage Chair Queue</h1>
    <span class="clock" id="clock"></span>
  </header>

  <div class="called" id="called" hidden role="alert"></div>

  <section class="board" aria-label="Queue board">
    <div class="slot">
      <span class="eyebrow">Past</span>
      <span class="num" id="pastNum">—</span>
      <span class="sub" id="pastSub"></span>
    </div>
    <div class="slot now">
      <span class="eyebrow">Now serving</span>
      <span class="num" id="curNum">—</span>
      <span class="sub" id="curSub">Chair is free</span>
      <span class="timer" id="curTimer"></span>
      <div class="bar"><div id="curBar"></div></div>
      <div class="actions" id="curActions"></div>
    </div>
    <div class="slot">
      <span class="eyebrow">Next</span>
      <span class="num" id="nextNum">—</span>
      <span class="sub" id="nextSub"></span>
    </div>
  </section>

  <section class="cols">
    <div class="panel">
      <h2>Take a number</h2>
      <div class="mine-card" id="mine" hidden></div>
      <div>
        <label for="name">Name (optional)</label>
        <input type="text" id="name" maxlength="30" placeholder="So others know who's up" autocomplete="off">
      </div>
      <div>
        <label for="dur">How long will you use the chair? <strong id="durLabel">15 min</strong></label>
        <div class="durs" id="durs"></div>
        <input type="range" id="dur" min="15" max="30" step="1" value="15">
      </div>
      <button class="primary" id="take" disabled>Get my number</button>
    </div>

    <div class="panel">
      <h2>Waiting list</h2>
      <ul class="q" id="list"><li class="empty">Loading the queue…</li></ul>
    </div>
  </section>

  <footer>
    <span class="status" id="status">Connecting…</span>
    <span class="btns">
      <button id="sound">Turn on sound</button>
      <button class="danger" id="reset" disabled>Reset queue</button>
    </span>
  </footer>
</div>

<script>
(() => {
  const GRACE_MIN = 3;          // minutes before a called no-show can be skipped
  const KEEP_FINISHED = 40;     // finished tickets kept in the record
  const MY_KEY = 'massageQueue.mine';
  const tabId = Math.random().toString(36).slice(2);
  const $ = id => document.getElementById(id);

  const LEASE_MS = 5000;            // lease length for one write
  const LEASE_MARGIN_MS = 500;      // a write must land at least this long before the lease can lapse
  const WRITE_DEADLINE_MS = 25000;  // keep retrying a write for this long before giving up
  const FINISH_GRACE_MS = 3000;     // end a session this long after 0:00 (server time)
  const SOUND_KEY = 'massageQueue.sound';
  let db = null, ref = null, state = null, canWrite = false, writeUnknown = false, isEditor = false;

  // Server clock: every device stamps and compares times on the store's clock, learned from
  // lease expiry times, so a phone with a wrong clock can't end sessions early or show odd timers.
  let clockOffset = 0, rttMs = 300;
  const now = () => Date.now() + clockOffset;

  // ---------- helpers ----------
  const fmt = n => '#' + String(n).padStart(3, '0');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const clockTime = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const mmss = ms => { const s = Math.ceil(Math.max(0, ms) / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const blank = () => ({ epoch: Math.random().toString(36).slice(2, 8), lastNum: 0, tickets: [] });

  const tickets = () => (state && state.tickets) || [];
  const inChair = () => tickets().find(t => t.status === 'active' || t.status === 'called');
  const waiting = () => tickets().filter(t => t.status === 'waiting').sort((a, b) => a.num - b.num);
  const lastFinished = () => tickets().filter(t => t.status === 'done' || t.status === 'skipped')
    .sort((a, b) => (b.endedAt || 0) - (a.endedAt || 0))[0];
  const remaining = t => Math.max(0, t.startedAt + t.minutes * 60000 - now());
  const who = t => t.name ? t.name : 'Guest';

  // Tickets this browser took (per-device memory, tied to the current queue epoch).
  function myNums() {
    try {
      const m = JSON.parse(localStorage.getItem(MY_KEY) || 'null');
      return m && state && m.epoch === state.epoch ? m.nums : [];
    } catch { return []; }
  }
  function addMine(num) {
    if (myNums().includes(num)) return;
    try { localStorage.setItem(MY_KEY, JSON.stringify({ epoch: state.epoch, nums: [...myNums(), num] })); } catch {}
  }

  // Take requests this device sent, kept across reloads. A take whose outcome is unknown (it
  // reported an error, but may have landed) stays "pending": the next tap reuses its id, so it
  // can't create a second ticket, and any ticket carrying one of these ids is claimed as ours.
  const REQS_KEY = 'massageQueue.reqs', PENDING_KEY = 'massageQueue.pendingReq';
  const readJson = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || 'null') ?? d; } catch { return d; } };
  const writeJson = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const myReqs = () => readJson(REQS_KEY, []);
  const rememberReq = req => writeJson(REQS_KEY, [...myReqs().filter(r => r !== req), req].slice(-30));
  function claimMyTickets() {
    if (!state || !state.tickets) return;
    const reqs = new Set(myReqs()), pending = readJson(PENDING_KEY, null);
    for (const t of state.tickets) {
      if (!t.req || !reqs.has(t.req)) continue;
      if (t.status !== 'done' && t.status !== 'skipped') addMine(t.num);
      if (t.req === pending) writeJson(PENDING_KEY, null); // its outcome is known now
    }
  }
  const isMine = t => t && myNums().includes(t.num);

  // Start time estimates for everyone waiting.
  function etas() {
    const cur = inChair();
    let free = now();
    if (cur) free += cur.status === 'active' ? remaining(cur) : cur.minutes * 60000;
    const out = {};
    for (const t of waiting()) { out[t.num] = free; free += t.minutes * 60000; }
    return out;
  }

  // ---------- shared writes: one writer at a time via a short lease ----------
  function advance(s) {
    if (s.tickets.some(t => t.status === 'active' || t.status === 'called')) return;
    const nxt = s.tickets.filter(t => t.status === 'waiting').sort((a, b) => a.num - b.num)[0];
    if (nxt) { nxt.status = 'called'; nxt.calledAt = now(); }
  }
  function prune(s) {
    const fin = s.tickets.filter(t => t.status === 'done' || t.status === 'skipped')
      .sort((a, b) => (b.endedAt || 0) - (a.endedAt || 0));
    const drop = new Set(fin.slice(KEEP_FINISHED).map(t => t.num));
    s.tickets = s.tickets.filter(t => !drop.has(t.num));
  }

  // Writes from this page run one at a time. The lease can't keep them apart, because a second
  // acquire from the same holder counts as a renewal.
  let writeChain = Promise.resolve();
  function mutate(fn) {
    const run = writeChain.then(() => mutateNow(fn));
    writeChain = run.catch(() => {});
    return run;
  }

  // Shorten our lease once we're done, so other devices don't wait out the full lease. It is
  // awaited, so it can't land after (and cut short) the lease the next write from this page takes.
  // A store call that never answers would stall every later write on this page, so each call
  // gets a time limit. A timed-out call is treated like a dropped request and retried.
  const CALL_TIMEOUT_MS = 15000;
  const withTimeout = (p, ms = CALL_TIMEOUT_MS) => Promise.race([p, new Promise((_, reject) =>
    setTimeout(() => reject({ code: 'unavailable', message: 'The store did not answer in time.' }), ms))]);
  // A release we stopped waiting for may still land later and shorten whatever lease we hold
  // then, so count the ones still in flight and budget a new lease as 1 s while any are.
  let releasesInFlight = 0;
  const release = () => {
    releasesInFlight++;
    const p = ref.acquire({ holder: tabId, ttlMs: 1000 }).catch(() => {}).finally(() => { releasesInFlight--; });
    return withTimeout(p, 5000).catch(() => {});
  };

  // Errors that retrying can't fix. Anything else (unavailable, unknown codes) is retried briefly.
  const FATAL = new Set(['invalid_argument', 'resource_exhausted', 'quota_exceeded', 'revoked',
    'not_granted', 'capability_disabled', 'capability_removed', 'transform_error']);
  const MAX_SLOW_TRIES = 2, MAX_TRANSIENT_TRIES = 2;

  // Learn this device's offset from the server clock from a lease's expiry time.
  function learnOffset(lease, askedAt, gotAt, ttl) {
    const exp = Date.parse(lease.expiresAt || '');
    if (lease.acquired && !isNaN(exp)) clockOffset = (exp - ttl) - (askedAt + gotAt) / 2;
  }

  async function mutateNow(fn) {
    if (!ref || !canWrite) return null;
    const deadline = Date.now() + WRITE_DEADLINE_MS;
    let slowTries = 0, transientTries = 0;
    // Each call's time limit is capped by what's left of the deadline, so one attempt can't run
    // far past it.
    const limit = () => Math.max(1000, Math.min(CALL_TIMEOUT_MS, deadline - Date.now()));
    while (Date.now() < deadline) {
      const askedAt = Date.now();
      let lease = null;
      try {
        lease = await withTimeout(ref.acquire({ holder: tabId, ttlMs: LEASE_MS }), limit());
        const gotAt = Date.now();
        rttMs = 0.7 * rttMs + 0.3 * (gotAt - askedAt);
        if (!lease.acquired) {
          // Wait until the other device's lease ends, but never longer than 2 s at a time.
          const exp = Date.parse(lease.expiresAt || '');
          const wait = isNaN(exp) ? 400 : Math.min(2000, Math.max(150, exp - now()));
          await sleep(wait + Math.random() * 300);
          continue;
        }
        learnOffset(lease, askedAt, gotAt, LEASE_MS);
        // The lease was granted about halfway through the round trip.
        const grantedAt = (askedAt + gotAt) / 2;
        const leaseBudget = releasesInFlight > 0 ? 1000 : LEASE_MS;
        const snap = await withTimeout(ref.get(), limit());
        const s = snap.exists ? structuredClone(snap.data()) : blank();
        s.tickets = s.tickets || [];
        const result = fn(s);
        if (result === false) { await release(); return null; }
        // The change is already saved (an earlier attempt landed even though it reported an error).
        if (result && result.alreadySaved) { await release(); clearWriteError(); return result.value; }
        advance(s); prune(s);
        // If the write might land after the lease lapses, another device could have read the same
        // state. Let go, back off and try again a limited number of times rather than overwrite theirs.
        if (Date.now() + rttMs / 2 + LEASE_MARGIN_MS > grantedAt + leaseBudget) {
          await release();
          if (++slowTries >= MAX_SLOW_TRIES) {
            setStatus('Your connection is too slow to save changes right now. Try again on a stronger signal.', true);
            return null;
          }
          await sleep(500 + Math.random() * 1000);
          continue;
        }
        await withTimeout(ref.set(s), limit());
        await release();
        clearWriteError();
        return result;
      } catch (e) {
        if (lease && lease.acquired) await release();
        const code = e && e.code;
        if (!FATAL.has(code) && ++transientTries <= MAX_TRANSIENT_TRIES && Date.now() < deadline) {
          await sleep(200 + Math.random() * 400); // a brief outage: retry as the store's docs advise
          continue;
        }
        handleWriteError(e);
        return null;
      }
    }
    setStatus('The queue is busy. Try again in a moment.', true);
    return null;
  }

  // A view-only person's first write is refused. Switch to read-only instead of
  // reporting a connection problem on every tap.
  function handleWriteError(e) {
    const code = e && e.code;
    if (code === 'invalid_argument' && writeUnknown) {
      canWrite = false; render();
      setStatus('You can view the queue but not change it. Ask the owner for Contributor access.', true);
    } else if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') {
      // Every later call will fail too, so stop offering actions.
      canWrite = false; render();
      setStatus('The queue is no longer available here.', true);
    } else if (code === 'resource_exhausted') {
      setStatus('Too many requests right now. Wait a moment and try again.', true);
    } else setStatus(errText(e), true);
  }
  const liveText = () => canWrite ? 'Live · updates on every device with this page open.' : 'Live · view only.';
  // Don't paper over a dead live connection: the board isn't updating until it reconnects.
  let listenerDead = false, listenerGaveUp = false;
  function clearWriteError() { if (!listenerDead && $('status').classList.contains('err')) setStatus(liveText()); }
  const errText = e => e && e.code === 'quota_exceeded' ? 'The queue storage is full. Reset the queue to continue.'
    : 'Could not reach the queue. Check your connection and try again.';

  // Each tap gets a request id stored on its ticket. If a save is retried after an error but the
  // first attempt had actually landed, the retry finds the ticket instead of adding a second one.
  let takeSeq = 0;
  const takeNumber = (name, minutes, req = tabId + ':' + (++takeSeq)) => mutate(s => {
    const existing = s.tickets.find(t => t.req === req);
    if (existing) return { alreadySaved: true, value: { num: existing.num, epoch: s.epoch } };
    const t = { num: ++s.lastNum, name, minutes, status: 'waiting', req };
    s.tickets.push(t);
    return { num: t.num, epoch: s.epoch };
  });
  const startSession = num => mutate(s => {
    const t = s.tickets.find(t => t.num === num);
    if (!t || t.status !== 'called') return false;
    t.status = 'active'; t.startedAt = now(); return true;
  });
  const finishSession = (num, status) => mutate(s => {
    const t = s.tickets.find(t => t.num === num);
    if (!t || (t.status !== 'active' && t.status !== 'called')) return false;
    // Re-check the no-show wait here, where the server clock offset has just been measured.
    // 1 s of slack: the button may have enabled on a slightly different clock estimate.
    if (status === 'skipped' && (t.status !== 'called' || now() - t.calledAt < GRACE_MIN * 60000 - 1000)) {
      setStatus(`A no-show can be skipped ${GRACE_MIN} minutes after the number is called.`, true);
      return false;
    }
    t.status = status; t.endedAt = now(); return true;
  });
  // Any device may end a session a few seconds after 0:00 on the server's clock. The check inside
  // autoFinish runs right after a lease, when this device's clock offset is freshly measured.
  const dueToFinish = t => now() - (t.startedAt + t.minutes * 60000) >= FINISH_GRACE_MS;
  const autoFinish = num => mutate(s => {
    const t = s.tickets.find(t => t.num === num);
    if (!t || t.status !== 'active' || !dueToFinish(t)) return false;
    t.status = 'done'; t.endedAt = t.startedAt + t.minutes * 60000; return true;
  });
  const leave = num => mutate(s => {
    const before = s.tickets.length;
    s.tickets = s.tickets.filter(t => !(t.num === num && t.status === 'waiting'));
    return s.tickets.length !== before;
  });
  // A reset carries an id too: if a timed-out reset had actually landed, its retry must not
  // reset again and wipe tickets taken since.
  const resetQueue = (req = tabId + ':reset:' + Date.now()) => mutate(s => {
    if (s.resetReq === req) return { alreadySaved: true, value: true };
    Object.assign(s, blank(), { resetReq: req });
    return true;
  });

  // ---------- alerts ----------
  // The sound choice is remembered on this device; browsers still need one tap per page load
  // before audio can play, so the page asks for that tap when it matters.
  const readSound = () => { try { return localStorage.getItem(SOUND_KEY); } catch { return null; } };
  const saveSound = on => { try { localStorage.setItem(SOUND_KEY, on ? 'on' : 'off'); } catch {} };
  let audio = null, soundOn = readSound() === 'on', soundTouched = readSound() !== null, lastCalled = undefined;
  const audioReady = () => !!audio && audio.state === 'running';
  async function unlockAudio() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      await audio.resume();
    } catch {}
  }
  // Refresh only what depends on sound. Action buttons are left alone, so a tap in progress
  // still reaches the button it started on.
  function refreshSoundUi() { syncSound(); render({ keepButtons: true }); }
  function chime(times = 1) {
    if (!soundOn || !audioReady()) return;
    try {
      for (let r = 0; r < times; r++) [660, 880, 990].forEach((f, i) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = 'sine'; o.frequency.value = f;
        const t0 = audio.currentTime + r * 1.1 + i * 0.22;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
        o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + 0.65);
      });
    } catch {}
  }
  function onCalledChange(cur) {
    const num = cur && cur.status === 'called' ? cur.num : null;
    if (lastCalled === undefined) { lastCalled = num; return; } // first load: no alert
    if (num === lastCalled) return;
    lastCalled = num;
    if (num == null) return;
    const mine = isMine(cur);
    chime(mine ? 3 : 1);
    if (mine) {
      try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch {}
      flashTitle(`${fmt(num)} — your turn!`);
    }
  }
  let flashTimer = null;
  function flashTitle(text) {
    const base = 'Massage Chair Queue';
    clearInterval(flashTimer);
    let on = false, n = 0;
    flashTimer = setInterval(() => {
      document.title = (on = !on) ? text : base;
      if (++n > 30) { clearInterval(flashTimer); document.title = base; }
    }, 1000);
  }

  // ---------- rendering ----------
  function btn(text, cls, fn) {
    const b = document.createElement('button');
    b.textContent = text; if (cls) b.className = cls;
    b.disabled = !canWrite;
    b.onclick = async () => { b.disabled = true; await fn(); b.disabled = !canWrite; };
    return b;
  }
  // Two-tap button for destructive actions (dialogs are not available in the viewer).
  // The armed state is kept outside the button, so a re-render from another device's change
  // doesn't swallow the second tap.
  const ARM_MS = 4000;
  let armed = { key: null, until: 0 };
  const isArmed = key => armed.key === key && Date.now() < armed.until;
  function confirmBtn(key, text, armedText, fn) {
    const b = document.createElement('button');
    b.className = 'danger'; b.disabled = !canWrite;
    const show = on => { b.classList.toggle('armed', on); b.textContent = on ? armedText : text; };
    show(isArmed(key));
    if (isArmed(key)) setTimeout(() => { if (!isArmed(key)) show(false); }, armed.until - Date.now() + 50);
    b.onclick = async () => {
      if (!isArmed(key)) {
        armed = { key, until: Date.now() + ARM_MS };
        show(true);
        setTimeout(() => { if (!isArmed(key)) show(false); }, ARM_MS + 50);
        return;
      }
      armed = { key: null, until: 0 };
      b.disabled = true; await fn();
      show(false); b.disabled = !canWrite;
    };
    return b;
  }
  function setStatus(text, err) { const s = $('status'); s.textContent = text; s.classList.toggle('err', !!err); }

  let pointerIsDown = false, renderDeferred = false;
  function render({ keepButtons = false } = {}) {
    // Mid-tap, keep the buttons and rebuild them once the tap is over (see pointerDone).
    if (!keepButtons && pointerIsDown) { renderDeferred = true; keepButtons = true; }
    const past = lastFinished(), cur = inChair(), q = waiting(), nxt = q[0], eta = etas();

    $('pastNum').textContent = past ? fmt(past.num) : '—';
    $('pastSub').textContent = past ? (past.status === 'skipped' ? 'No-show' : 'Finished ' + clockTime(past.endedAt)) : '';
    $('curNum').textContent = cur ? fmt(cur.num) : '—';
    $('curSub').textContent = cur ? `${who(cur)} · ${cur.minutes} min` : (state ? 'Chair is free' : '');
    $('nextNum').textContent = nxt ? fmt(nxt.num) : '—';
    $('nextSub').textContent = nxt ? `${who(nxt)} · ${nxt.minutes} min · ~${clockTime(eta[nxt.num])}` : (state ? 'No one waiting' : '');

    const acts = $('curActions');
    if (!keepButtons) acts.replaceChildren();
    if (keepButtons) { /* leave the action buttons as they are */ }
    else if (cur && cur.status === 'called') {
      acts.append(btn("I'm here, start timer", 'go', () => startSession(cur.num)));
      const skip = confirmBtn('skip-' + cur.num, 'Skip (no-show)', 'Tap again to skip', () => finishSession(cur.num, 'skipped'));
      skip.id = 'skipBtn'; skip.title = `Available ${GRACE_MIN} min after the number is called`;
      acts.append(skip);
    } else if (cur) {
      acts.append(confirmBtn('end-' + cur.num, 'End session early', 'Tap again to end', () => finishSession(cur.num, 'done')));
    }

    // Called banner
    const banner = $('called');
    if (cur && cur.status === 'called') {
      const mine = isMine(cur);
      banner.replaceChildren();
      const n = document.createElement('span'); n.className = 'num'; n.textContent = fmt(cur.num);
      const p = document.createElement('p');
      p.textContent = mine ? "It's your turn. Please go to the massage chair and tap “I'm here” to start your timer."
        : `${who(cur)}, please proceed to the massage chair.`;
      banner.append(n, p);
      banner.classList.toggle('mine', mine);
      banner.hidden = false;
    } else banner.hidden = true;

    // My ticket card
    const mine = myNums().map(n => tickets().find(t => t.num === n)).filter(t => t && t.status !== 'done' && t.status !== 'skipped');
    const card = $('mine');
    if (mine.length) {
      const t = mine[0];
      card.replaceChildren();
      const l = document.createElement('span'); l.className = 'eyebrow'; l.textContent = 'Your number';
      const n = document.createElement('span'); n.className = 'num'; n.textContent = fmt(t.num);
      const m = document.createElement('span'); m.className = 'msg';
      if (t.status === 'called') m.textContent = "You're up! Head to the chair now.";
      else if (t.status === 'active') m.textContent = `Enjoy your session · ${mmss(remaining(t))} left`;
      else {
        const ahead = q.filter(w => w.num < t.num).length + (cur ? 1 : 0);
        m.textContent = `${ahead} ahead of you · starts around ${clockTime(eta[t.num])}. ` +
          (soundOn && audioReady() ? "Keep this page open; it will chime when it's your turn."
            : "Keep this page open. Turn on the alert sound so this phone chimes when it's your turn.");
      }
      card.append(l, n, m);
      // Only promise a chime when one will actually play; otherwise offer the tap that enables it.
      if (t.status === 'waiting' && !(soundOn && audioReady())) {
        const sb = document.createElement('button');
        sb.textContent = 'Turn on alert sound';
        sb.onclick = async () => { soundOn = true; soundTouched = true; saveSound(true); await unlockAudio(); refreshSoundUi(); chime(); };
        card.append(sb);
      }
      card.hidden = false;
    } else card.hidden = true;

    // Waiting list
    const ul = $('list');
    if (!keepButtons) { ul.replaceChildren();
    if (!state) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'Loading the queue…'; ul.append(li); }
    else if (!q.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = 'No one waiting'; ul.append(li); }
    q.forEach((t, i) => {
      const li = document.createElement('li');
      const n = document.createElement('span'); n.className = 'n'; n.textContent = fmt(t.num);
      const w = document.createElement('span'); w.className = 'who'; w.textContent = who(t) + ' ';
      const sm = document.createElement('small'); sm.textContent = `· ${t.minutes} min`; w.append(sm);
      if (isMine(t)) { const y = document.createElement('span'); y.className = 'you'; y.textContent = 'You'; w.append(y); }
      const e = document.createElement('span'); e.className = 'eta';
      e.textContent = (i === 0 ? 'Next' : `${i} ahead`) + ' · ~' + clockTime(eta[t.num]);
      li.append(n, w, e);
      if (isMine(t) || isEditor) li.append(confirmBtn('leave-' + t.num, isMine(t) ? 'Leave' : 'Remove', 'Tap again', () => leave(t.num)));
      ul.append(li);
    });
    }

    // Stay disabled while a take is still saving, even when other devices' updates re-render.
    $('take').disabled = taking || !canWrite || !state;
    $('reset').hidden = !isEditor;
    $('reset').disabled = !canWrite || !state;
    tick(true);
  }

  let finishing = null, nextFinishTry = 0;
  function tick(fromRender) {
    $('clock').textContent = new Date(now()).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
    const cur = inChair(), timer = $('curTimer'), bar = $('curBar');
    if (!cur) { timer.textContent = ''; bar.style.width = '0'; return; }
    if (cur.status === 'called') {
      timer.className = 'timer small';
      timer.textContent = 'Waiting for arrival · ' + mmss(now() - cur.calledAt);
      bar.style.width = '0';
      const skip = $('skipBtn');
      if (skip && canWrite && !skip.classList.contains('armed')) skip.disabled = now() - cur.calledAt < GRACE_MIN * 60000;
    } else {
      const rem = remaining(cur);
      timer.className = 'timer';
      timer.textContent = mmss(rem) + ' left';
      bar.style.width = Math.min(100, Math.max(0, 100 - rem / (cur.minutes * 600))) + '%';
      if (rem === 0 && finishing !== cur.num && canWrite && dueToFinish(cur) && Date.now() >= nextFinishTry) {
        finishing = cur.num;
        // If the write didn't go through, clear the guard and try again in 5 s.
        autoFinish(cur.num).then(r => {
          if (r == null && finishing === cur.num) { finishing = null; nextFinishTry = Date.now() + 5000; }
        });
      }
    }
    if (!fromRender && isMine(cur) && cur.status === 'active') {
      const m = document.querySelector('#mine .msg');
      if (m) m.textContent = `Enjoy your session · ${mmss(remaining(cur))} left`;
    }
  }

  // ---------- form ----------
  const dur = $('dur'), durs = $('durs');
  [15, 20, 25, 30].forEach(m => {
    const b = document.createElement('button'); b.type = 'button';
    b.textContent = m + ' min'; b.dataset.m = m;
    b.onclick = () => { dur.value = m; syncDur(); };
    durs.append(b);
  });
  function syncDur() {
    $('durLabel').textContent = dur.value + ' min';
    durs.querySelectorAll('button').forEach(b => b.classList.toggle('sel', b.dataset.m === dur.value));
  }
  dur.oninput = syncDur; syncDur();

  let taking = false;
  $('take').onclick = async () => {
    if (taking) return;
    taking = true;
    const b = $('take'); b.disabled = true; b.textContent = 'Getting your number…';
    if (!soundTouched) { soundOn = true; saveSound(true); } // respect a viewer who turned sound off
    unlockAudio().then(refreshSoundUi);
    const minutes = Math.min(30, Math.max(15, parseInt(dur.value, 10) || 15));
    // Reuse the id of an earlier take whose outcome is unknown, so a retry can't add a second ticket.
    const req = readJson(PENDING_KEY, null) || (tabId + ':' + Date.now() + ':' + Math.random().toString(36).slice(2, 6));
    writeJson(PENDING_KEY, req);
    rememberReq(req);
    let res = await takeNumber($('name').value.trim().slice(0, 30), minutes, req);
    taking = false;
    // The save reported failure, but a live update may already show it landed.
    if (!res && state && state.tickets) {
      const landed = state.tickets.find(t => t.req === req);
      if (landed) res = { num: landed.num, epoch: state.epoch };
    }
    if (res) {
      writeJson(PENDING_KEY, null);
      try {
        const prev = JSON.parse(localStorage.getItem(MY_KEY) || 'null');
        const nums = prev && prev.epoch === res.epoch ? prev.nums : [];
        if (!nums.includes(res.num)) localStorage.setItem(MY_KEY, JSON.stringify({ epoch: res.epoch, nums: [...nums, res.num] }));
      } catch {}
      $('name').value = '';
      // Don't hide a dead live connection: without updates this page can't alert anyone.
      if (listenerDead) setStatus(listenerGaveUp
        ? `You're ${fmt(res.num)}, but this page isn't receiving updates, so it can't alert you. Reload the page.`
        : `You're ${fmt(res.num)}. This page is reconnecting and can't alert you until it's back; keep it open.`, true);
      else setStatus(`You're ${fmt(res.num)}. Keep this page open to be alerted.`);
    }
    b.textContent = 'Get my number';
    render();
  };

  function syncSound() {
    const b = $('sound');
    const playing = soundOn && audioReady();
    b.textContent = playing ? 'Sound on' : soundOn ? 'Tap to enable sound' : 'Turn on sound';
    b.classList.toggle('sel', playing);
  }
  $('sound').onclick = async () => {
    soundTouched = true;
    // "Tap to enable sound" (sound on, but this page load hasn't been allowed to play yet) only
    // unlocks audio. It must not toggle sound off.
    if (!(soundOn && !audioReady())) { soundOn = !soundOn; saveSound(soundOn); }
    await unlockAudio();
    refreshSoundUi();
    if (soundOn) chime();
  };
  syncSound();

  const resetBtn = $('reset');
  let resetTimer;
  resetBtn.onclick = async () => {
    if (!resetBtn.classList.contains('armed')) {
      resetBtn.classList.add('armed'); resetBtn.textContent = 'Tap again to clear everyone';
      resetTimer = setTimeout(() => { resetBtn.classList.remove('armed'); resetBtn.textContent = 'Reset queue'; }, 4000);
      return;
    }
    clearTimeout(resetTimer); resetBtn.classList.remove('armed'); resetBtn.textContent = 'Reset queue';
    resetBtn.disabled = true;
    if (await resetQueue() && !listenerDead) setStatus('Queue cleared. Numbers start again from #001.');
    render();
  };

  setInterval(() => tick(false), 1000);
  render();

  // ---------- connect ----------
  (async () => {
    db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!db) {
      setStatus('Open this page on claude.ai while signed in to join the live queue.', true);
      return;
    }
    const user = await window.claude.use('user');
    const can = user ? await user.can('data.write') : null;
    canWrite = can !== false;
    writeUnknown = can == null;
    isEditor = user ? !!(await user.canEdit()) : false;
    ref = db.doc('queue/state');

    // Learn the server clock right away, so timers, Skip and ending sessions are right even before
    // this device saves anything. It uses a separate document so it never holds up the queue.
    if (canWrite) {
      const clockRef = db.doc('queue/clock');
      const askedAt = Date.now();
      clockRef.acquire({ holder: tabId, ttlMs: 1000 })
        .then(lease => { learnOffset(lease, askedAt, Date.now(), 1000); render(); })
        .catch(() => {});
    }

    let reconnects = 0;
    function subscribe() {
      const slow = setTimeout(() => setStatus('Still connecting to the queue…', true), 10000);
      ref.onSnapshot(snap => {
        if (!snap.metadata.fromCache) {
          clearTimeout(slow);
          const s = $('status');
          if (listenerDead || s.textContent.startsWith('Connecting') || s.textContent.startsWith('Still connecting')) {
            listenerDead = false; listenerGaveUp = false; reconnects = 0;
            setStatus(liveText());
          }
        }
        state = snap.exists ? snap.data() : { epoch: '', lastNum: 0, tickets: [] };
        claimMyTickets(); // tickets from earlier takes whose outcome this device didn't learn
        onCalledChange(inChair());
        render();
      }, e => {
        clearTimeout(slow);
        listenerDead = true;
        const code = e && e.code;
        // Access withdrawn or the capability gone: every new listener and write would fail too.
        if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') {
          listenerGaveUp = true; canWrite = false; render();
          setStatus('The queue is no longer available here.', true);
          return;
        }
        // A mistake in the request itself: a new listener would fail the same way.
        if (code === 'invalid_argument' || code === 'transform_error') {
          listenerGaveUp = true;
          setStatus('Lost the connection to the queue. Reload the page to reconnect.', true);
          return;
        }
        // Everything else, unknown codes included, is treated as the store not answering, where the
        // docs say a fresh listener is the only way back. Keep trying while the page is open (an
        // unattended kiosk must recover on its own), waiting longer each time up to 30 s. A rate
        // limit (resource_exhausted) waits a full minute so it doesn't add to the load.
        reconnects++;
        setStatus('Lost the connection to the queue. Reconnecting…', true);
        setTimeout(subscribe, code === 'resource_exhausted' ? 60000 : Math.min(30000, 2000 * reconnects));
      });
    }
    subscribe();
  })();

  // Unlock audio on the first tap so later chimes can play. Phones only allow audio from the end
  // of a touch (a click), not from the moment the finger lands, so this listens for click. The
  // listener stays until audio is actually running, since a scroll is not a click. It runs after
  // the tapped button's own handler, so refreshing the sound UI can't swallow that tap.
  function unlockOnTap() {
    unlockAudio().then(() => {
      setTimeout(refreshSoundUi, 0);
      if (audioReady()) document.removeEventListener('click', unlockOnTap);
    });
  }
  document.addEventListener('click', unlockOnTap);

  // While a finger or mouse button is down, hold off rebuilding buttons, so an update arriving from
  // another device mid-tap can't swallow the tap. The rebuild runs right after the tap.
  document.addEventListener('pointerdown', () => { pointerIsDown = true; }, true);
  const pointerDone = () => {
    pointerIsDown = false;
    if (renderDeferred) { renderDeferred = false; setTimeout(() => render(), 350); }
  };
  document.addEventListener('pointerup', pointerDone, true);
  document.addEventListener('pointercancel', pointerDone, true);
})();
</script>
